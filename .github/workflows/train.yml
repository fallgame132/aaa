name: Train Tiny GPT

on:
  push:
    branches:
      - main
      - master
      - claude/create-mini-ai-G7Qms
    paths:
      - "**.py"
      - "sample_text.txt"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      max_iters:
        description: "Шагов обучения (полное)"
        required: false
        default: "3000"
      temperature:
        description: "Температура генерации"
        required: false
        default: "0.8"

jobs:
  # ─── Быстрый smoke-test при каждом пуше (~30 сек) ───────────────────────────
  smoke:
    name: Smoke test (300 шагов)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Быстрое обучение (300 шагов)
        run: python train.py --max-iters 300 --batch-size 16

      - name: Тест генерации
        run: python generate.py --prompt "Однажды" --tokens 100 --temperature 0.8

  # ─── Полное обучение только по ручному запуску ───────────────────────────────
  train-full:
    name: Полное обучение (${{ github.event.inputs.max_iters }} шагов)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Полное обучение
        run: |
          python train.py \
            --max-iters ${{ github.event.inputs.max_iters }}

      - name: Тест генерации
        run: |
          python generate.py \
            --prompt "Однажды" \
            --tokens 200 \
            --temperature ${{ github.event.inputs.temperature }}

      - name: Загрузка чекпоинта как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: tiny-gpt-checkpoint-${{ github.run_number }}
          path: checkpoint.pt
          retention-days: 30

      - name: Информация о модели
        run: |
          python - <<'EOF'
          import torch
          ckpt = torch.load("checkpoint.pt", map_location="cpu", weights_only=False)
          cfg = ckpt["cfg"]
          print(f"vocab_size : {len(ckpt['stoi'])}")
          print(f"n_embd     : {cfg.n_embd}")
          print(f"n_head     : {cfg.n_head}")
          print(f"n_layer    : {cfg.n_layer}")
          print(f"block_size : {cfg.block_size}")
          print(f"max_iters  : {cfg.max_iters}")
          EOF
